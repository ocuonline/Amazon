<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/popup.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <title>Amazon Ürün Takip Eklentisi</title>
    <script src="src/echarts.min.js"></script>
  </head>
  <body>
    <div id="topbar">
      <div id="topbar-left">
        <picture>
          <source srcset="icons/icon32.png" media="(prefers-color-scheme: dark)" />
          <source srcset="icons/darkicon32.png" media="(prefers-color-scheme: light)" />
          <img src="icons/icon32.png" alt="logo" class="logo" />
        </picture>
        <input type="text" id="search-box" placeholder="Ürün veya ID ara..." aria-label="Ürün arama kutusu" />
      </div>
      <div id="topbar-right">
        <button id="filter-clear-btn" title="Filtreyi Temizle" style="display: none">✕</button>
        <button id="filter-btn" title="Filtrele">
          <span class="material-icons">filter_list</span>
        </button>
        <button id="sort-btn" title="Sırala">
          <span class="material-icons">sort</span>
        </button>
        <button id="percent-mode-btn" title="Yüzde Modu">%</button>
        <div id="sort-menu">
          <div class="filter-option" data-sort-by="name">🔤 Ürün Adı</div>
          <div class="filter-option" data-sort-by="date">📅 Eklenme Tarihi</div>
          <div class="filter-option" data-sort-by="Nprice">💰 Ürün Fiyatı</div>
          <div class="filter-option" data-sort-by="Ndate">🕒 Değişim Tarihi</div>
          <div class="filter-option" data-sort-by="percent">📊 Değişim Oranı</div>
        </div>
        <button id="feedback-button" title="Geri Bildirim">
          <span class="material-icons">feedback</span>
        </button>
        <button id="settings-button" title="Ayarlar">
          <span class="material-icons">settings</span>
        </button>
      </div>
      <div id="filter-menu">
        <div class="filter-option" data-filter="target">🎯 Hedef Fiyat</div>
        <div class="filter-option" data-filter="discount">⬇️ İndirimli</div>
        <div class="filter-option" data-filter="stock-in">
          <span class="material-icons" style="color: #3498db; font-size: 14px">add_circle</span> Stoğa Giren
        </div>
        <div class="filter-option" data-filter="increase">⬆️ Zamlanan</div>
        <div class="filter-option" data-filter="stock-out">
          <span class="material-icons" style="color: #e74c3c; font-size: 14px">do_not_disturb</span> Stoğu Yok
        </div>
        <hr />
        <div class="filter-group-row">
          <div class="filter-option" data-filter="🔴">🔴</div>
          <div class="filter-option" data-filter="🟡">🟡</div>
          <div class="filter-option" data-filter="🟢">🟢</div>
        </div>
      </div>
    </div>

    <div id="list-header">
      <div class="col-check">
        <button id="update-button" title="Fiyatları Güncelle">
          <span class="material-icons">sync</span>
        </button>
      </div>
      <div class="col-group">
        <button id="p-group" title="Gruba Göre Sırala" style="font-size: 1.5em">🚦</button>
      </div>
      <div class="col-pic"></div>
      <div class="col-name">
        <div class="col-name-header">
          <div id="check-progress" style="display: none">
            <div id="check-progress-bar"></div>
            <span id="check-progress-text"><span>Kontrol</span><span></span></span>
          </div>
          <span>ÜRÜN ADI</span>
        </div>
      </div>

      <div class="col-price">
        <span>FİYAT</span>
      </div>
      <div class="col-percent">
        <span>ORAN</span>
      </div>
      <div class="col-delete">
        <button id="delete-all" title="Tüm ürünleri sil">
          <span class="material-icons">delete_sweep</span>
        </button>
      </div>
    </div>

    <div id="product-list"></div>
    <div id="last-update-time"></div>

    <div id="alarm-modal" class="modal-overlay" style="display: none">
      <div class="modal-box">
        <div class="modal-title">Hedef Fiyat Belirle</div>
        <div class="modal-product-name" id="modal-product-name"></div>
        <input type="text" id="modal-alarm-input" class="modal-input" placeholder="Hedef fiyat girin..." inputmode="decimal" />
        <div id="modal-alarm-error" class="modal-error"></div>
        <div class="modal-actions">
          <button id="modal-delete-target" class="modal-btn modal-btn-delete">Hedefi Sil</button>
          <button id="modal-cancel" class="modal-btn modal-btn-cancel">İptal</button>
          <button id="modal-save" class="modal-btn modal-btn-save">Kaydet</button>
        </div>
      </div>
    </div>

    <div id="priceHistoryContainer" style="display: none">
      <div id="priceHistoryChart" style="width: 100%; height: 200px"></div>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
